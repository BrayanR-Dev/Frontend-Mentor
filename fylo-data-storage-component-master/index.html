<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/output.css">

  <title>Frontend Mentor | Fylo data storage component</title>

</head>

<body class="font-Raleway bg-Blue-950">
  <main class="min-h-screen md:min-w-screen flex justify-center items-center bg-[url(/images/bg-mobile.png)] md:bg-[url(/images/bg-desktop.png)] bg-no-repeat bg-bottom bg-contain">
    <section class="flex flex-col md:flex-row gap-5 md:gap-8 items-end -translate-y-16">
      <div class="bg-Blue-850 w-full ps-7 py-10 md:ps-8 md:pe-36 rounded-tr-[110px] rounded-lg space-y-8">
        <img src="./images/logo.svg" alt="icon-brand-recognition">
        <div class="flex items-stretch gap-7">
          <div class="bg-Blue-950 p-3 flex justify-center items-center rounded-md">
            <img src="./images/icon-document.svg" alt="icon-access-anywhere">
          </div>
          <div class="bg-Blue-950 p-3 flex justify-center items-center rounded-md">
            <img src="./images/icon-folder.svg" alt="icon-security">
          </div>
          <div class="bg-Blue-950 p-3 flex justify-center items-center rounded-md">
            <img src="./images/icon-upload.svg" alt="icon-collaboration">
          </div>
        </div>
      </div>
      <div class="bg-Blue-850 rounded-lg space-y-5 pb-14 px-10 py-8 relative">
        <p class="text-Blue-200">You’ve used <span class="font-bold">815</span> <span class="font-bold">GB</span> of your storage</p>
        <div class="bg-white flex items-center gap-3 justify-center rounded-lg md:rounded-br-none absolute -bottom-14 left-1/2 -translate-x-1/2 md:bottom-auto md:left-auto md:translate-x-0 md:-top-12 md:right-10.5 px-6 py-4 md:after:content-[''] md:after:absolute md:after:-bottom-7 md:after:right-0
            md:after:w-7 md:after:h-7 md:after:bg-white
            md:after:[clip-path:polygon(0_0,100%_0,100%_100%)]">
          <p class="text-Blue-950 font-bold text-4xl">185</p>
          <p class="uppercase text-grayish-blue">GB Left</p>
        </div>
        <div>
          <div class="md:w-lg bg-Blue-950/60 p-1 rounded-full">
            <div class="bg-linear-to-r from-gradient1 to-gradient2 w-8/10 h-3 rounded-full flex items-center justify-end pe-0.5">
              <div class="rounded-full h-2 w-2 bg-Blue-200"></div>
            </div>
          </div>
          <div class="flex justify-between items-center">
            <p class="text-Blue-200 font-semibold">0 GB</p>
            <p class="text-Blue-200 font-semibold">1000 GB</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
